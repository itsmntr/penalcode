<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator Pasal LSPD</title>
<style>
:root{color-scheme:dark;--bg:#121316;--side:#17181c;--card:#1b1c21;--line:#2a2b32;--ink:#e8e8ec;--mute:#8b8c96;--acc:#6366f1;--acc-ink:#fff;--soft:rgba(99,102,241,.16);--soft-ink:#9a9df9;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:1.05rem;padding:8px 10px 16px}
.tab{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;color:var(--mute);text-decoration:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--soft);color:var(--soft-ink)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.isi{min-width:0}
main{max-width:1100px;margin:0 auto;padding:24px;display:grid;gap:16px}
@media(min-width:1000px){main{grid-template-columns:1fr 380px;align-items:start}aside{position:sticky;top:24px}}
.satu{grid-template-columns:1fr!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h1{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 12px;font-weight:600}
h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft-ink);margin:16px 0 4px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
input[type=search]{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mute)}
.row input{width:96px;text-align:right;flex:none}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-bottom:1px solid var(--line)}
li b{display:block}
li span{display:block;color:var(--mute);font-size:.9rem}
.total{display:flex;justify-content:space-between;gap:12px;padding-top:12px;font-weight:600}
.cv{color:var(--mute);font-size:.9rem;margin-top:4px}
.empty{color:var(--mute)}
.btn{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:inherit;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.reset{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:0;float:right;text-transform:none;letter-spacing:0}
.cek{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.cek input{width:22px;height:22px;flex:none;margin:1px 0 0;padding:0;accent-color:var(--acc)}
.status{font-weight:600;margin-bottom:8px}
.status.tahan{color:var(--bad)}
.cat{color:var(--mute);font-size:.9rem;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
@media(max-width:799px){
.app{grid-template-columns:1fr}
.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
.brand{display:none}
.tab{white-space:nowrap;padding:8px 12px}
main{padding:16px}
}
</style>
</head>
<body>
<div class="app">
<nav class="side">
<div class="brand">LSPD Tools</div>
<a class="tab" href="#pasal"><svg class="ic" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Kalkulator pasal</a>
<a class="tab" href="#kendaraan"><svg class="ic" viewBox="0 0 24 24"><path d="M3 13l2-6h14l2 6v4H3zM7 17v2M17 17v2M3 13h18"/></svg>Keluarkan kendaraan</a>
<a class="tab" href="#senjata"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Weapon class</a>
</nav>
<div class="isi">
<main id="p-pasal">
  <section class="card">
    <h1>Evidence yang dibawa suspect</h1>
    <input type="search" id="cari" placeholder="Cari evidence..." autocomplete="off">
    <div id="daftar"></div>
  </section>
  <aside class="card">
    <h1>Pasal yang dikenakan <button class="reset" id="reset">Reset</button></h1>
    <ul id="hasil"></ul>
    <div class="total"><span>Total</span><span id="total">-</span></div>
    <div class="cv" id="cv"></div>
    <button class="btn" id="salin" disabled>Salin</button>
  </aside>
</main>
<main id="p-kendaraan" hidden>
  <section class="card">
    <h1>Pengecekan sebelum release</h1>
    <div id="langkah"></div>
    <h2>Hambatan (centang kalau ada)</h2>
    <div id="blokir"></div>
  </section>
  <aside class="card">
    <h1>Status <button class="reset" id="reset-rilis">Reset</button></h1>
    <div class="status" id="status"></div>
    <ul id="sisa"></ul>
    <div class="total"><span>Biaya release</span><span id="biaya"></span></div>
  </aside>
</main>
<main id="p-senjata" class="satu" hidden>
  <section class="card">
    <h1>Weapon class</h1>
    <input type="search" id="cari-senjata" placeholder="Cari senjata..." autocomplete="off">
    <div id="senjata-daftar"></div>
  </section>
</main>
</div>
</div>
<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const jml = {};
const rp = n => "$" + n.toLocaleString("id-ID");

function gambarDaftar(q = "") {
  const kat = {};
  EVIDENCE.filter(e => e.nama.toLowerCase().includes(q.toLowerCase()))
    .forEach(e => (kat[e.kat] ||= []).push(e));
  $("#daftar").innerHTML = Object.entries(kat).map(([k, list]) =>
    `<h2>${k}</h2>` + list.map(e =>
      `<label class="row"><span>${e.nama}<small>${e.satuan}</small></span>` +
      `<input type="number" min="0" inputmode="numeric" placeholder="0" data-id="${e.id}" value="${jml[e.id] || ""}"></label>`
    ).join("")).join("") || '<p class="empty">Tidak ada yang cocok.</p>';
}

function hitung() {
  const peta = new Map();
  const tambah = ([id, n]) => peta.set(id, (peta.get(id) || 0) + n);
  EVIDENCE.forEach(e => jml[e.id] > 0 && e.pasal(jml[e.id]).forEach(tambah));
  TOTAL(jml).forEach(tambah);
  return [...peta].map(([id, n]) => ({ id, n, ...PASAL[id] }));
}

function gambarHasil() {
  const h = hitung();
  const biasa = h.filter(p => !p.cv);
  const cv = h.filter(p => p.cv);
  const f = biasa.reduce((a, p) => a + p.fine * p.n, 0);
  const s = biasa.reduce((a, p) => a + p.sentence * p.n, 0);
  $("#hasil").innerHTML = h.length
    ? h.map(p => `<li><b>${p.id} ${p.nama}${p.n > 1 ? ` ×${p.n}` : ""}</b>` +
        `<span>${p.cv ? "COURT VERDICT" : `${rp(p.fine * p.n)} · ${p.sentence * p.n} ${SATUAN_SENTENCE}`}</span>` +
        (p.catatan ? `<span>${p.catatan}</span>` : "") + `</li>`).join("")
    : '<li class="empty">Isi jumlah evidence di samping.</li>';
  $("#total").textContent = biasa.length ? `${rp(f)} · ${s} ${SATUAN_SENTENCE}` : "-";
  $("#cv").textContent = cv.length ? `+ ${cv.length} pasal Court Verdict (tidak masuk total)` : "";
  $("#salin").disabled = !h.length;
  return { h, f, s, cv };
}

$("#daftar").addEventListener("input", e => {
  jml[e.target.dataset.id] = Math.max(0, +e.target.value || 0);
  gambarHasil();
});
$("#cari").addEventListener("input", e => gambarDaftar(e.target.value));
$("#reset").addEventListener("click", () => {
  Object.keys(jml).forEach(k => delete jml[k]);
  gambarDaftar($("#cari").value);
  gambarHasil();
});
$("#salin").addEventListener("click", async e => {
  const { h, f, s, cv } = gambarHasil();
  const baris = h.map(p => `- ${p.id} ${p.nama}${p.n > 1 ? ` x${p.n}` : ""} ` +
    (p.cv ? "(Court Verdict)" : `(${rp(p.fine * p.n)} / ${p.sentence * p.n} ${SATUAN_SENTENCE})`));
  await navigator.clipboard.writeText(
    baris.join("\n") + `\nTotal: ${rp(f)} / ${s} ${SATUAN_SENTENCE}` + (cv.length ? ` + ${cv.length} Court Verdict` : ""));
  e.target.textContent = "Tersalin";
  setTimeout(() => (e.target.textContent = "Salin"), 1200);
});

gambarDaftar();
gambarHasil();

const cek = {};
function gambarRilis() {
  const kotak = (list, awalan) => list.map((t, i) =>
    `<label class="cek"><input type="checkbox" data-k="${awalan}${i}" ${cek[awalan + i] ? "checked" : ""}><span>${t.nama || t}</span></label>`).join("");
  $("#langkah").innerHTML = kotak(LANGKAH_RELEASE, "l");
  $("#blokir").innerHTML = kotak(BLOKIR_RELEASE, "b");
  $("#biaya").textContent = rp(BIAYA_RELEASE);
  statusRilis();
}
function statusRilis() {
  const blok = BLOKIR_RELEASE.filter((_, i) => cek["b" + i]);
  const sisa = LANGKAH_RELEASE.filter((_, i) => !cek["l" + i]);
  let judul, daftar;
  if (blok.length) { judul = "TAHAN, jangan dikeluarkan"; daftar = blok.map(b => b.aksi); }
  else if (sisa.length) { judul = `Belum selesai, ${sisa.length} pengecekan tersisa`; daftar = sisa; }
  else { judul = "Bisa dikeluarkan"; daftar = [`Tagihkan biaya regulasi ${rp(BIAYA_RELEASE)}`, "Serahkan kunci kendaraan"]; }
  $("#status").textContent = judul;
  $("#status").classList.toggle("tahan", blok.length > 0);
  $("#sisa").innerHTML = daftar.map(d => `<li>${d}</li>`).join("");
}
document.querySelector("#p-kendaraan").addEventListener("change", e => {
  cek[e.target.dataset.k] = e.target.checked;
  statusRilis();
});
$("#reset-rilis").addEventListener("click", () => { Object.keys(cek).forEach(k => delete cek[k]); gambarRilis(); });

const PANEL = ["pasal", "kendaraan", "senjata"];
function tab() {
  const h = PANEL.includes(location.hash.slice(1)) ? location.hash.slice(1) : "pasal";
  PANEL.forEach(p => ($("#p-" + p).hidden = p !== h));
  document.querySelectorAll(".tab").forEach(a => a.setAttribute("aria-selected", a.hash === "#" + h));
}
function gambarSenjata(q = "") {
  const c = q.toLowerCase();
  $("#senjata-daftar").innerHTML = WEAPON.map(g => {
    const l = g.senjata.filter(n => n.toLowerCase().includes(c));
    if (!l.length) return "";
    const p = g.pasal && PASAL[g.pasal];
    return `<h2>${g.jenis} · Class ${g.kelas}</h2>` +
      (p ? `<p class="cat">${g.pasal} ${p.nama} · ${rp(p.fine)} · ${p.sentence} ${SATUAN_SENTENCE}</p>` : "") +
      `<div class="chips">${l.map(n => `<span class="chip">${n}</span>`).join("")}</div>`;
  }).join("") || '<p class="empty">Tidak ada yang cocok.</p>';
}
$("#cari-senjata").addEventListener("input", e => gambarSenjata(e.target.value));
addEventListener("hashchange", tab);
gambarSenjata();
gambarRilis();
tab();
</script>
</body>
</html>
