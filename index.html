<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator Pasal LSPD</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1a;--mute:#6b6a66;--line:#e1dfd9;--acc:#1f4d7a;--acc-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1d1d1b;--ink:#ecebe7;--mute:#9a9892;--line:#2e2e2b;--acc:#6aa5d8;--acc-ink:#0f1a24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px;display:grid;gap:16px}
@media(min-width:800px){main{grid-template-columns:1fr 360px;align-items:start}}
h1{font-size:1.25rem;margin:0 0 12px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:16px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input[type=search]{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mute)}
.row input[type=number]{width:96px;text-align:right;flex:none}
.row input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--acc)}
.row label{flex:1}
.ctl{display:flex;gap:8px;align-items:center;flex:none}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
@media(min-width:800px){aside{position:sticky;top:16px}}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-bottom:1px solid var(--line)}
li b{display:block}
li span{display:block;color:var(--mute);font-size:.9rem}
.total{display:flex;justify-content:space-between;gap:12px;padding-top:12px;font-weight:600}
.cv{color:var(--mute);font-size:.9rem;margin-top:4px}
.empty{color:var(--mute)}
.btn{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:inherit;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.reset{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:0;float:right}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>Jenis kejahatan &amp; evidence <small style="color:var(--mute);font-weight:400">v3</small></h1>
    <input type="search" id="cari" placeholder="Cari, misalnya laundromat atau meth" autocomplete="off">
    <div id="daftar"></div>
  </section>
  <aside class="card">
    <h1>Pasal yang dikenakan <button class="reset" id="reset">Reset</button></h1>
    <div id="hasil"></div>
    <div class="total"><span>Total</span><span id="total">-</span></div>
    <div class="cv" id="cv"></div>
    <button class="btn" id="salin" disabled>Salin</button>
  </aside>
</main>

// tier(satuan, [[batasAtas inklusif, idPasal|null, label], ...], [nilaiTepatYangAmbigu])
// pasal(q) mengembalikan [[idPasal, jumlahStack, [keterangan]], ...]
const tier = (satuan, tiers, ambigu = []) => ({ tiers, ambigu, pasal: q => {
  const i = tiers.findIndex(([m]) => q <= m), [m, id, lbl] = tiers[i];
  if (!id) return [];
  const ket = [`Tingkat: ${lbl}`];
  if (isFinite(m)) ket.push(`${(m + 1 - q).toLocaleString("id-ID")} ${satuan} lagi → ${tiers[i + 1][2]}`);
  if (ambigu.includes(q)) ket.push(`Tepat ${q.toLocaleString("id-ID")} ${satuan}: handbook berbeda, konfirmasi ke IC`);
  return [[id, 1, ket]];
} });
const stack = id => q => [[id, q]];
const jmlSenjata = j => (j.fw1 || 0) + (j.fw2 || 0) + (j.fw3 || 0) + (j.govfw || 0);
// Pasal per pucuk hanya berlaku untuk total 8 pucuk atau kurang; lebih dari itu diganti Weapon Smuggling di TOTAL
const senjata = id => (q, j) => jmlSenjata(j) > 8 ? [] : [[id, q]];
const cek = (...ids) => () => ids.map(id => [id, 1]);
const jenis = (id, nama, ...kode) => ({ id: "j-" + id, kat: "Jenis kejahatan", nama, tipe: "cek", utama: true, pasal: cek(...kode) });

const SCH1 = tier("gram", [[60, "(6)00", "Misdemeanor"], [Infinity, "(6)01", "Felony"]]);
const SCH2 = tier("gram", [[100, "(6)02", "Misdemeanor"], [Infinity, "(6)03", "Felony"]]);

  jenis("ltd", "Perampokan warung / LTD", "(3)08"),
  jenis("atm", "Perampokan ATM", "(3)28"),
  jenis("rumah", "Perampokan rumah (Burglary)", "(3)17"),

  jenis("sandergov2", "Menyandera pegawai pemerintah Level 2 (petinggi)", "(1)27"),
  jenis("sandergov1", "Menyandera pegawai pemerintah Level 1 (ketua)", "(1)26"),
  jenis("sandergovx", "Menyandera pegawai pemerintah diperberat (3 orang ke atas)", "(1)29"),

  jenis("produksi", "Produksi narkotika", "(6)06"),

  jenis("evade", "Kabur dari polisi (Evading)", "(5)06"),
  jenis("recevade", "Kabur ugal-ugalan (Reckless Evading)", "(8)08"),

  // Weed + Opium dijumlah (Schedule I); Meth + Cocaine dijumlah (Schedule II). Pasalnya dihitung di TOTAL.

    ...tier("item", [[10, "(6)07A", "10 item atau kurang"], [Infinity, "(6)07B", "11 item ke atas"]], [10]) },
  { id: "poppy", kat: "Narkotika", nama: "Tanaman poppy", satuan: "kg",
    ...tier("kg", [[100, null, "Tanpa charge"], [199, "(6)10", "Unlawful"], [300, "(6)11", "Felony"], [Infinity, "(6)12", "Aggravated"]]) },

  { id: "brandish", kat: "Senjata & Amunisi", nama: "Brandishing senjata api (mengacungkan di depan umum)", tipe: "cek", pasal: cek("(7)16") },
  { id: "fw1", kat: "Senjata & Amunisi", nama: "Firearm Class 1 (Pistol .50, Ceramic Pistol, X17, Machine Pistol, dll.)", satuan: "pucuk", pasal: senjata("(7)03") },
  { id: "fw2", kat: "Senjata & Amunisi", nama: "Firearm Class 2 (SMG, Micro SMG, Pump Shotgun, Sawn Off, Navy Revolver, dll.)", satuan: "pucuk", pasal: senjata("(7)04") },

  { id: "govfw", kat: "Senjata & Amunisi", nama: "Senjata api milik pemerintah/LEO", satuan: "pucuk", pasal: senjata("(7)06") },
  { id: "baton", kat: "Senjata & Amunisi", nama: "Baton milik pemerintah", satuan: "buah", pasal: stack("(7)07") },

  // Attachment: 1 = terpasang di senjata, 2 = tidak terpasang (dihitung sebagai komponen senjata di TOTAL)
  { id: "suppress", kat: "Attachment senjata", nama: "Suppressor", tipe: "att", info: "Terpasang: (7)49 Usage of Suppressor", pasal: q => q === 1 ? [["(7)49", 1]] : [] },

  { id: "nos", kat: "Kendaraan", nama: "Nitrous oxide", satuan: "tabung", pasal: stack("(8)31") },
  { id: "race", kat: "Kendaraan", nama: "Perangkat balap ilegal (pembatas kecepatan dilepas, dll.)", satuan: "buah", pasal: stack("(8)33") },

  { id: "host", kat: "Sandera & Perlawanan", nama: "Sandera warga", satuan: "orang", pasal: q => [[q <= 2 ? "(1)24" : "(1)25", 1]] },
  { id: "resist", kat: "Sandera & Perlawanan", nama: "Resisting Arrest (kabur membawa mobil)", tipe: "cek", pasal: cek("(5)07") },
  { id: "accessory", kat: "Sandera & Perlawanan", nama: "Membantu pelaku perampokan (Accessory)", tipe: "cek", pasal: cek("(3)27") },
  { id: "driveby", kat: "Sandera & Perlawanan", nama: "Drive-by shooting (menembak sambil berkendara)", tipe: "cek", pasal: cek("(7)42") },
  { id: "crimuse", kat: "Sandera & Perlawanan", nama: "Menggunakan senjata api (hasil GSR positif)", tipe: "cek", pasal: cek("(7)15") },
  { id: "tamper", kat: "Sandera & Perlawanan", nama: "Menghilangkan/membuang barang bukti saat dikejar", tipe: "cek", pasal: cek("(4)17A") },
  { id: "obstruct", kat: "Sandera & Perlawanan", nama: "Menghalangi tugas polisi (non-robbery)", tipe: "cek", pasal: cek("(4)20") },

const COMP = tier("unit", [[20, "(7)45", "Misdemeanor"], [Infinity, "(7)46", "Felony"]], [20]);

// Pasal dari total gabungan. Narkotika: total 800 g ke atas menggantikan pasal possession per schedule.
// Senjata: lebih dari 8 pucuk menggantikan pasal per pucuk dengan Weapon Smuggling.
const TOTAL = q => {
  const s1 = (q.weed || 0) + (q.opium || 0), s2 = (q.meth || 0) + (q.cocaine || 0), narko = s1 + s2;
  const senj = jmlSenjata(q);
  const hasil = [];
  if (narko >= 4000) hasil.push(["(6)05", 1, [`Total narkotika ${narko} gram (4000 ke atas)`]]);
  else if (narko >= 2000) hasil.push(["(6)04", 1, [`Total narkotika ${narko} gram (2000 ke atas)`]]);
  else if (narko >= 800) hasil.push(["(6)08", 1, [`Total narkotika ${narko} gram (800 ke atas)`, ...(narko === 800 ? ["Tepat 800 gram: teks pasal menulis di atas 800, panduan kasus 800 ke atas. Konfirmasi ke IC"] : [])]]);
  else [[s1, SCH1], [s2, SCH2]].forEach(([n, t]) => n > 0 && t.pasal(n).forEach(x => hasil.push(x)));

  if (senj > 8) {
    const rinci = [["Class 1", q.fw1], ["Class 2", q.fw2], ["Class 3", q.fw3], ["Government", q.govfw]].filter(([, n]) => n).map(([k, n]) => `${n} ${k}`).join(", ");
    hasil.push(["(7)36", 1, [`${senj} pucuk senjata (${rinci}), lebih dari 8`, "Pasal per pucuk tidak dipakai, diganti Weapon Smuggling"]]);
  }

  const lepas = ["suppress", "scope", "mag"].filter(k => q[k] === 2).length;
  const komponen = (q.comp || 0) + lepas;
  if (komponen > 0) COMP.pasal(komponen).forEach(([id, c, ket]) => hasil.push([id, c, [
    ...(lepas ? [`Termasuk ${lepas} attachment tidak terpasang`] : []), ...ket,
    ...(komponen > 40 ? ["Lebih dari 40 komponen: indikator Weapon Smuggling, pertimbangkan Court Verdict (7)36"] : [])]]));
  return hasil;
};
</script>
<script>
const $ = s => document.querySelector(s);
const jml = {};
const rp = n => "$" + n.toLocaleString("id-ID");
const harga = p => p.cv ? "Court Verdict" : `${rp(p.fine * p.n)} / ${p.sentence * p.n} ${SATUAN_SENTENCE}`;

function gambarDaftar(q = "") {
  const kat = {};
  EVIDENCE.filter(e => e.nama.toLowerCase().includes(q.toLowerCase()))
    .forEach(e => (kat[e.kat] ||= []).push(e));
  $("#daftar").innerHTML = Object.entries(kat).map(([k, list]) =>
    `<h2>${k}</h2>` + list.map(e => {
      const v = jml[e.id] || 0;
      const sub = e.tipe === "cek" ? "" : `<small>${e.tipe === "att" ? "" : e.satuan + (e.info ? " · " : "")}${e.info || ""}</small>`;
      if (e.tipe === "att") return `<div class="row"><label for="c-${e.id}">${e.nama}${sub}</label><span class="ctl">` +
        `<select data-id="${e.id}" data-att aria-label="Status ${e.nama}" ${v ? "" : "hidden"}>` +
        `<option value="1"${v === 2 ? "" : " selected"}>Terpasang</option><option value="2"${v === 2 ? " selected" : ""}>Tidak terpasang</option></select>` +
        `<input type="checkbox" id="c-${e.id}" data-id="${e.id}" data-att ${v ? "checked" : ""}></span></div>`;
      const kontrol = e.tipe === "cek"
        ? `<input type="checkbox" data-id="${e.id}" ${v ? "checked" : ""}>`
        : `<input type="number" min="0" inputmode="numeric" placeholder="0" data-id="${e.id}" value="${v || ""}">`;
      return `<label class="row"><span>${e.nama}${sub}</span>${kontrol}</label>`;
    }).join("")).join("") || '<p class="empty">Tidak ada yang cocok.</p>';
}

function hitung() {
  const peta = new Map();
  const tambah = utama => ([id, n, ket = []]) => {
    const p = peta.get(id) || { id, n: 0, utama: false, ket: [], ...PASAL[id] };
    p.n += n; p.utama ||= utama; p.ket.push(...ket);
    peta.set(id, p);
  };
  EVIDENCE.forEach(e => jml[e.id] > 0 && e.pasal(jml[e.id], jml).forEach(tambah(!!e.utama)));
  TOTAL(jml).forEach(tambah(false));
  return [...peta.values()].sort((a, b) => b.utama - a.utama);
}

function gambarHasil() {
  const h = hitung();
  const biasa = h.filter(p => !p.cv), cv = h.length - biasa.length;
  const f = biasa.reduce((a, p) => a + p.fine * p.n, 0);
  const s = biasa.reduce((a, p) => a + p.sentence * p.n, 0);
  const item = p => `<li><b>${p.id} ${p.nama}${p.n > 1 ? ` ×${p.n}` : ""}</b><span>${harga(p)}</span>` +
    [p.catatan, ...p.ket].filter(Boolean).map(k => `<span>${k}</span>`).join("") + `</li>`;
  const blok = (judul, arr) => arr.length ? `<h2>${judul}</h2><ul>${arr.map(item).join("")}</ul>` : "";
  $("#hasil").innerHTML = h.length
    ? blok("Kode utama", h.filter(p => p.utama)) + blok("Pasal lain", h.filter(p => !p.utama))
    : '<p class="empty">Pilih jenis kejahatan atau isi evidence di samping.</p>';
  $("#total").textContent = biasa.length ? `${rp(f)} / ${s} ${SATUAN_SENTENCE}` : "-";
  $("#cv").textContent = cv ? `+ ${cv} pasal Court Verdict (tidak masuk total)` : "";
  $("#salin").disabled = !h.length;
  return { h, biasa, f, s, cv };
}

$("#daftar").addEventListener("input", e => {
  const t = e.target, id = t.dataset.id;
  if (t.dataset.att !== undefined) {
    const cb = t.parentElement.querySelector("input"), sel = t.parentElement.querySelector("select");
    sel.hidden = !cb.checked;
    jml[id] = cb.checked ? +sel.value : 0;
  } else jml[id] = t.type === "checkbox" ? +t.checked : Math.max(0, +t.value || 0);
  gambarHasil();
});
$("#cari").addEventListener("input", e => gambarDaftar(e.target.value));
$("#reset").addEventListener("click", () => {
  Object.keys(jml).forEach(k => delete jml[k]);
  gambarDaftar($("#cari").value);
  gambarHasil();
});
$("#salin").addEventListener("click", async e => {
  const { h, biasa, f, s, cv } = gambarHasil();
  const baris = p => `- ${p.id} ${p.nama}${p.n > 1 ? ` x${p.n}` : ""} (${harga(p)})`;
  const blok = (judul, arr) => arr.length ? `${judul}:\n${arr.map(baris).join("\n")}\n` : "";
  await navigator.clipboard.writeText(
    blok("Main Penal Code", h.filter(p => p.utama)) + blok("Pasal lain", h.filter(p => !p.utama)) +
    (biasa.length ? `Total: ${rp(f)} / ${s} ${SATUAN_SENTENCE}` : "") + (cv ? ` + ${cv} Court Verdict` : ""));
  e.target.textContent = "Tersalin";
  setTimeout(() => (e.target.textContent = "Salin"), 1200);
});

gambarDaftar();
gambarHasil();
</script>
</body>
</html>
