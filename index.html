<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator Pasal LSPD</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1a;--mute:#6b6a66;--line:#e1dfd9;--acc:#1f4d7a;--acc-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1d1d1b;--ink:#ecebe7;--mute:#9a9892;--line:#2e2e2b;--acc:#6aa5d8;--acc-ink:#0f1a24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px;display:grid;gap:16px}
@media(min-width:800px){main{grid-template-columns:1fr 360px;align-items:start}}
h1{font-size:1.25rem;margin:0 0 12px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:16px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input[type=search]{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mute)}
.row input,.row select{flex:none}
.row input[type=number]{width:96px;text-align:right}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.row select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-width:150px}
@media(min-width:800px){aside{position:sticky;top:16px}}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-bottom:1px solid var(--line)}
li b{display:block}
li span{display:block;color:var(--mute);font-size:.9rem}
.total{display:flex;justify-content:space-between;gap:12px;padding-top:12px;font-weight:600}
.cv{color:var(--mute);font-size:.9rem;margin-top:4px;white-space:pre-line}
.empty{color:var(--mute)}
.btn{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:inherit;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.reset{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:0;float:right}
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>Evidence yang dibawa suspect</h1>
    <input type="search" id="cari" placeholder="Cari evidence..." autocomplete="off">
    <div id="daftar"></div>
  </section>
  <aside class="card">
    <h1>Pasal yang dikenakan <button class="reset" id="reset">Reset</button></h1>
    <ul id="hasil"></ul>
    <div class="total"><span>Total</span><span id="total">-</span></div>
    <div class="cv" id="cv"></div>
    <button class="btn" id="salin" disabled>Salin</button>
  </aside>
</main>
<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const jml = {};
const rp = n => "$" + n.toLocaleString("id-ID");
const kode = p => p.kode === undefined ? p.id + " " : (p.kode ? p.kode + " " : "");
const aktif = e => e.tipe === "pilih" ? !!jml[e.id] : jml[e.id] > 0;

function gambarDaftar(q = "") {
  const kat = {};
  EVIDENCE.filter(e => (e.nama + " " + e.kat).toLowerCase().includes(q.toLowerCase()))
    .forEach(e => (kat[e.kat] ||= []).push(e));
  $("#daftar").innerHTML = Object.entries(kat).map(([k, list]) =>
    `<h2>${k}</h2>` + list.map(kolom).join("")).join("") || '<p class="empty">Tidak ada yang cocok.</p>';
}

function kolom(e) {
  const v = jml[e.id];
  if (e.tipe === "cek")
    return `<label class="row"><span>${e.nama}</span><input type="checkbox" data-id="${e.id}"${v ? " checked" : ""}></label>`;
  if (e.tipe === "pilih")
    return `<label class="row"><span>${e.nama}</span><select data-id="${e.id}"><option value="">Tidak ada</option>` +
      e.opsi.map(([t, id]) => `<option value="${id}"${v === id ? " selected" : ""}>${t}</option>`).join("") + `</select></label>`;
  return `<label class="row"><span>${e.nama}<small>${e.satuan}</small></span>` +
    `<input type="number" min="0" inputmode="numeric" placeholder="0" data-id="${e.id}" value="${v || ""}"></label>`;
}

function hitung() {
  const peta = new Map();
  const tambah = ([id, n]) => peta.set(id, (peta.get(id) || 0) + n);
  EVIDENCE.forEach(e => aktif(e) && e.pasal(jml[e.id]).forEach(tambah));
  TOTAL(jml).forEach(tambah);
  return [...peta].map(([id, n]) => ({ id, n, ...PASAL[id] }));
}

function gambarHasil() {
  const h = hitung();
  const cv = h.filter(p => p.cv);
  const tanpa = h.filter(p => !p.cv && p.fine == null);
  const biasa = h.filter(p => !p.cv && p.fine != null);
  const f = biasa.reduce((a, p) => a + p.fine * p.n, 0);
  const s = biasa.reduce((a, p) => a + p.sentence * p.n, 0);
  const info = p => p.cv ? "COURT VERDICT" : p.fine == null ? "Nominal belum diisi" : `${rp(p.fine * p.n)} · ${p.sentence * p.n} ${SATUAN_SENTENCE}`;
  $("#hasil").innerHTML = h.length
    ? h.map(p => `<li><b>${kode(p)}${p.nama}${p.n > 1 ? ` ×${p.n}` : ""}</b><span>${info(p)}</span>` +
        (p.catatan ? `<span>${p.catatan}</span>` : "") + `</li>`).join("")
    : '<li class="empty">Isi jumlah evidence di samping.</li>';
  $("#total").textContent = biasa.length ? `${rp(f)} · ${s} ${SATUAN_SENTENCE}` : "-";
  $("#cv").textContent = [cv.length && `+ ${cv.length} pasal Court Verdict (tidak masuk total)`,
    tanpa.length && `+ ${tanpa.length} pasal belum ada nominal (tidak masuk total)`].filter(Boolean).join("\n");
  $("#salin").disabled = !h.length;
  return { h, f, s, cv, tanpa };
}

$("#daftar").addEventListener("input", e => {
  const t = e.target, id = t.dataset.id;
  if (!id) return;
  jml[id] = t.type === "checkbox" ? +t.checked : t.tagName === "SELECT" ? t.value : Math.max(0, +t.value || 0);
  gambarHasil();
});
$("#cari").addEventListener("input", e => gambarDaftar(e.target.value));
$("#reset").addEventListener("click", () => {
  Object.keys(jml).forEach(k => delete jml[k]);
  gambarDaftar($("#cari").value);
  gambarHasil();
});
$("#salin").addEventListener("click", async e => {
  const { h, f, s, cv, tanpa } = gambarHasil();
  const baris = h.map(p => `- ${kode(p)}${p.nama}${p.n > 1 ? ` x${p.n}` : ""} ` +
    (p.cv ? "(Court Verdict)" : p.fine == null ? "(nominal belum diisi)" : `(${rp(p.fine * p.n)} / ${p.sentence * p.n} ${SATUAN_SENTENCE})`));
  const teks = baris.join("\n") + `\nTotal: ${rp(f)} / ${s} ${SATUAN_SENTENCE}` +
    (cv.length ? ` + ${cv.length} Court Verdict` : "") + (tanpa.length ? ` + ${tanpa.length} pasal tanpa nominal` : "");
  try {
    await navigator.clipboard.writeText(teks);
    e.target.textContent = "Tersalin";
  } catch {
    e.target.textContent = "Gagal menyalin";
  }
  setTimeout(() => (e.target.textContent = "Salin"), 1200);
});

gambarDaftar();
gambarHasil();
</script>
</body>
</html>
